[project]
name = "eegnet-seizure"
version = "0.1.0"
description = "EEGNet (Lawhern et al. 2018, braindecode implementation) trained for seizure detection on 18-ch bipolar EEG"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.14.1",
    "torch>=2.4",
    "braindecode>=1.0",
    "epilepsy2bids>=0.0.6",
    "timescoring>=0.0.5",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eegnet_seizure"]
