[project]
name = "evaluation"
version = "0.1.0"
description = "SzCORE-compatible evaluation for seizure detection robustness experiments"
requires-python = ">=3.10"
dependencies = [
    "timescoring>=0.0.5",
    "epilepsy2bids>=0.0.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
