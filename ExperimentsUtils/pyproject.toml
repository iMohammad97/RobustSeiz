[project]
name = "experiments-utils"
version = "0.1.0"
description = "Shift definitions and experiment orchestration for seizure robustness study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.14.1",
    "torch>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiments_utils"]
