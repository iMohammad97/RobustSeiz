services:
  main:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ACTIVE_MODEL: ${ACTIVE_MODEL:-SeizureTransformer}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    # /data and /output are mounted per run by run_experiment.py (or with -v for manual runs).
